<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us!</title>
  </head>
  <body>
    <h2>Contact Us</h2>

    <label for="fillin">Fill in the form below to contact us</label>
    <p>
      <label for="name">Name</label>
      <input type="text" id="name" />
    </p>

    <p>
      <button><label for="email">Put your Email</label></button>
      <input type="email" id="email" />
    </p>

    <p>
      <label for="message">Your Message</label>
    </p>
    <textarea id="message" name="message"></textarea>

    <br />
    <br />

    <label for="subject">Subject</label>
    <select name="subjects" id="subject">
      <option value="mathematics">Mathematics</option>
      <option value="biology">Biology</option>
      <option value="other">other</option>
    </select>
    <br />

    <input
      type="radio"
      id="subject-one"
      value="mathematics"
      name="subject-options" />
    <label for="subject-one">Mathematics</label>
    <br />
    <input
      type="radio"
      id="subject-two"
      value="biology"
      name="subject-options" />
    <label for="subject-two">Biology</label>
    <br />
    <input
      type="radio"
      id="subject-three"
      value="Arts"
      name="subject-options" />
    <label for="subject-three">Arts</label>
  </body>
</html>
