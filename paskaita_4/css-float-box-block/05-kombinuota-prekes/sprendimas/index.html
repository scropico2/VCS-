<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>5 užduotis – prekių eilė</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shop">
    <h1>Savaitės pasiūlymai</h1>

    <div class="product">
      <img src="img/preke.svg" alt="">
      <h3>Klaviatūra <span class="badge">-20%</span></h3>
      <p class="price">47,99 € <span class="old">59,99 €</span></p>
      <a class="btn" href="#">Į krepšelį</a>
    </div>
    <div class="product">
      <img src="img/preke.svg" alt="">
      <h3>Pelė <span class="badge">-20%</span></h3>
      <p class="price">23,99 € <span class="old">29,99 €</span></p>
      <a class="btn" href="#">Į krepšelį</a>
    </div>
    <div class="product last">
      <img src="img/preke.svg" alt="">
      <h3>Ausinės <span class="badge">-20%</span></h3>
      <p class="price">63,99 € <span class="old">79,99 €</span></p>
      <a class="btn" href="#">Į krepšelį</a>
    </div>

    <p class="footer">Rodomos 3 prekės iš 12</p>
  </div>
</body>
</html>
